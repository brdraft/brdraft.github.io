name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publica só os arquivos do site; material interno fica fora.
      - name: Montar _site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'backlog/' \
            --exclude 'BACKLOG.md' \
            --exclude 'README.md' \
            --exclude 'brd-portfolio-otimizacao.html'

      # Versiona CSS/JS com o commit para o navegador não usar cache velho.
      - name: Cache-busting
        run: |
          find _site -name '*.html' -exec sed -i -E \
            "s#(\.(css|js))\?v=[^\"]*\"#\1?v=${GITHUB_SHA::7}\"#g" {} +

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
